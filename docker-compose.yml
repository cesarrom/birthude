version: "3.8"

services:
  # Database migrations
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "pnpm drizzle-kit migrate"]
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    networks:
      - shared_db_net
    # Run migrations and exit

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database - uses internal Docker network
      POSTGRES_URL: ${POSTGRES_URL}
      
      # NextAuth - external URL must be set via env
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUSTED_HOSTS: ${AUTH_TRUSTED_HOSTS:-localhost:3000}
      
      # AI Services
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      
      # Geocoding
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY}
      
      # File Upload
      # Contento CMS
      CONTENTO_BASE_URL: ${CONTENTO_BASE_URL}
      CONTENTO_PROJECT_ID: ${CONTENTO_PROJECT_ID}
      CONTENTO_PROJECT_SLUG: ${CONTENTO_PROJECT_SLUG}
      CONTENTO_API_KEY: ${CONTENTO_API_KEY}
      
      
      # Payment (dLocal Go)
      DLOCAL_GO_API_KEY: ${DLOCAL_GO_API_KEY}
      DLOCAL_GO_SECRET_KEY: ${DLOCAL_GO_SECRET_KEY}
      DLOCAL_GO_ENV: ${DLOCAL_GO_ENV:-sandbox}
      
      # Node
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No ports exposed - Dokploy handles routing
    # The app listens on port 3000 internally
    networks:
      - shared_db_net

volumes:
  postgres_data:
networks:
  shared_db_net:
    external: true

